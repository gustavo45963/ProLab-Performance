# Blueprint do Render — deploy em um clique (New → Blueprint)
# Cria o web service (Docker) + base de dados PostgreSQL já ligados.

services:
  - type: web
    name: prolab-performance
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prolab-db
          property: connectionString

databases:
  - name: prolab-db
    plan: free
    databaseName: prolab
    user: prolab
